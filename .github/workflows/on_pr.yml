---
name: Pull Request

on:
  # Enable manual running of action if necessary
  workflow_dispatch:
  # Test build/deploy on PRs to main/master
  pull_request:
    # Only publish on push to main branch
    branches:
      - main
    # Don't trigger if it's just a documentation update
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '**.yml'
      - '**.yaml'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.dockerignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mlat_client_ref: ${{ steps.source_refs.outputs.mlat_client_ref }}
      pw_feeder_ref: ${{ steps.source_refs.outputs.pw_feeder_ref }}
      pw_feeder_version: ${{ steps.source_refs.outputs.pw_feeder_version }}
      readsb_ref: ${{ steps.source_refs.outputs.readsb_ref }}
    steps:
      - name: Resolve upstream source revisions
        id: source_refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_ref() {
            local repository="$1"
            local ref="$2"
            local sha

            sha="$(git ls-remote "${repository}" "${ref}^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "${sha}" ]]; then
              sha="$(git ls-remote "${repository}" "${ref}" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve ${repository} ${ref}" >&2
              return 1
            fi
            printf '%s\n' "${sha}"
          }

          READSB_REPOSITORY=https://github.com/mictronics/readsb-protobuf.git
          PW_FEEDER_REPOSITORY=https://github.com/plane-watch/pw-feeder.git
          MLAT_CLIENT_REPOSITORY=https://github.com/wiedehopf/mlat-client.git

          READSB_TAG="$(
            git ls-remote --refs --tags --sort=-version:refname "${READSB_REPOSITORY}" |
              awk 'NR == 1 { sub("refs/tags/", "", $2); print $2 }'
          )"
          PW_FEEDER_VERSION="$(curl \
            --fail \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --location \
            --silent \
            --show-error \
            https://api.github.com/repos/plane-watch/pw-feeder/releases/latest | jq -r .tag_name)"
          if [[ -z "${READSB_TAG}" ]]; then
            echo "Could not resolve the latest readsb-protobuf tag" >&2
            exit 1
          fi
          if [[ -z "${PW_FEEDER_VERSION}" || "${PW_FEEDER_VERSION}" == null ]]; then
            echo "Could not resolve the latest pw-feeder release" >&2
            exit 1
          fi

          {
            echo "readsb_ref=$(resolve_ref "${READSB_REPOSITORY}" "refs/tags/${READSB_TAG}")"
            echo "pw_feeder_ref=$(resolve_ref "${PW_FEEDER_REPOSITORY}" "refs/tags/${PW_FEEDER_VERSION}")"
            echo "pw_feeder_version=${PW_FEEDER_VERSION}"
            echo "mlat_client_ref=$(resolve_ref "${MLAT_CLIENT_REPOSITORY}" HEAD)"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache_scope: amd64
            qemu_platform: ''
          - platform: linux/arm64
            cache_scope: arm64
            qemu_platform: arm64
          - platform: linux/arm/v7
            cache_scope: armv7
            qemu_platform: arm
    steps:
      - name: Set up QEMU
        if: ${{ matrix.qemu_platform != '' }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu_platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.platform }} (no push)
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            READSB_PROTOBUF_REF=${{ needs.prepare.outputs.readsb_ref }}
            PW_FEEDER_REF=${{ needs.prepare.outputs.pw_feeder_ref }}
            PW_FEEDER_VERSION=${{ needs.prepare.outputs.pw_feeder_version }}
            MLAT_CLIENT_REF=${{ needs.prepare.outputs.mlat_client_ref }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ needs.prepare.outputs.pw_feeder_version }}
          cache-from: type=gha,scope=plane-watch-${{ matrix.cache_scope }}
          cache-to: type=gha,scope=plane-watch-${{ matrix.cache_scope }},mode=max
