---
name: Linting (Markdown)

on:
  pull_request:
    branches:
      - main
      # only run these if markdown files are updated
    paths:
      - '**.md'
      - '**.MD'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Run markdownlint against markdown files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Pull markdownlint/markdownlint:latest Image
        run: docker pull markdownlint/markdownlint:latest
      - name: Run markdownlint against *.md files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t MARKDOWN_FILES < <(
            find . -type f -iname '*.md' ! -iname 'license.md' ! -path './.git/*' -print0
          )
          docker run --rm -i \
            --volume "${PWD}:/workdir" \
            --workdir /workdir \
            markdownlint/markdownlint:latest \
            --rules ~MD013,~MD033,~MD026,~MD002,~MD022 \
            "${MARKDOWN_FILES[@]}"
